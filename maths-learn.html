<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
<!-- The "Learn" phase that comes before a skill's practice problems (maths-skill.html): maths-learn.html?skill=<id>.
     A digital whiteboard: words appear one at a time, maths is written out line by line, the graph draws itself.
     Data: maths-learn.js, generated by pipeline/requirements/maths/learn.py (facts from the skills database, content checked with SymPy). -->
<style>
:root {
  --ink: #1A1916; --muted: #7A7870; --soft: #4a4540; --accent: #fa4c06; --accent-strong: #c23504;
  --page: #EDEBE6; --board: #ffffff; --line: #e6e0d6; --pencil: #3d3a36;
  --hl1: #d9480f; --hl1-bg: #ffe3d3;
  --hl2: #1c5fd1; --hl2-bg: #dce8ff;
  --hl3: #0f7a4a; --hl3-bg: #d5f2e3;
  --hl4: #7c3aed; --hl4-bg: #ece3ff;
  --font: 'Outfit', system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box }
html { background: var(--page) }
body { margin: 0; color: var(--ink); font-family: var(--font); line-height: 1.5; background: var(--page) }
button, a { font: inherit }

/* top: where this sits in the skill: Learn, then Practise */
.bar { max-width: 1240px; margin: 0 auto; padding: 18px 20px 0; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center }
.back { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-decoration: none }
.back:hover { color: var(--ink) }
.phases { display: flex; gap: 6px; font-size: 0.78rem; font-weight: 700 }
.phases span, .phases a { padding: 5px 12px; border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.55) }
.phases a { text-decoration: none }
.phases a:hover { color: var(--ink) }
.phases [hidden] { display: none }
.phases .now { background: var(--ink); color: #fff }

/* the whiteboard */
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 20px 120px; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 28px; align-items: start }
.rail { position: sticky; top: 24px; list-style: none; margin: 40px 0 0; padding: 0; display: grid; gap: 4px }
.rail li { display: flex; gap: 10px; align-items: center; font-size: 0.86rem; font-weight: 600; color: var(--muted); padding: 6px 0; transition: color .3s }
.rail li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; flex-shrink: 0; transition: background .3s }
.rail li[aria-current] { color: var(--ink) }
.rail li[aria-current]::before { background: var(--accent); border-color: var(--accent) }
.rail li.done { color: var(--soft) }
.rail li.done::before { background: var(--soft); border-color: var(--soft) }
.board { background-color: var(--board);
  background-image: radial-gradient(rgba(26, 25, 22, 0.075) 1px, transparent 1.2px); background-size: 26px 26px;
  border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 10px 40px rgba(60, 40, 20, .08);
  padding: 44px clamp(20px, 5vw, 64px) 64px; min-height: 80vh }
@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 12px 10px 110px }
  .rail { position: sticky; top: 0; z-index: 5; margin: 0 0 10px; display: flex; gap: 4px; background: var(--page); padding: 8px 2px }
  .rail li { flex: 1; font-size: 0; padding: 0; height: 4px; border-radius: 4px; background: rgba(26,25,22,.12) }
  .rail li::before { display: none }
  .rail li.done, .rail li[aria-current] { background: var(--ink) }
  .rail li[aria-current] { background: var(--accent) }
  .board { border-radius: 18px; padding: 28px 18px 48px }
}

/* sections on the board */
.sec { margin: 0 0 46px }
.board * { scroll-margin: 70px 0 110px }   /* auto-scroll keeps the writing clear of the playback bar */
.sec > .lbl { display: block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-strong); margin: 0 0 10px }
.kicker { font-size: 0.9rem; font-weight: 700; color: var(--muted); margin: 0 0 4px }
h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.02; letter-spacing: -0.03em; font-weight: 800; max-width: 16ch }
.say { margin: 0 0 14px; font-size: clamp(1.08rem, 1.9vw, 1.28rem); line-height: 1.55; max-width: 38em }
.say.small { font-size: 0.98rem; color: var(--soft) }
.say b { font-weight: 700 }

/* words appear one at a time */
.w { display: inline-block; opacity: 0; transform: translateY(0.18em); filter: blur(2px); transition: opacity .3s var(--ease), transform .3s var(--ease), filter .3s; white-space: pre }
.w.on { opacity: 1; transform: none; filter: none }
.pop { opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .35s var(--ease), transform .35s var(--ease) }
.pop.on { opacity: 1; transform: none }
.instant .w, .instant .pop { transition: none !important }

/* maths written out: each side of the = is wiped in left to right, with a pen dot at the writing point */
.work { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 0.35em; row-gap: 6px; align-items: baseline;
  font-size: clamp(1.05rem, 2vw, 1.3rem); margin: 6px 0 18px; overflow-x: auto; overflow-y: hidden; padding: 6px 2px }
.work .cell { position: relative; white-space: nowrap }
.work .lhs { text-align: right }
.work .full { grid-column: 1 / -1 }
.work .aside { grid-column: 1 / -1; font-size: 0.92rem; color: var(--muted); margin: 2px 0 }
.pen { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 4px rgba(250, 76, 6, .18); pointer-events: none; opacity: 0 }

/* colour slots: a quantity keeps its colour on every line and on the graph */
.hl { padding: 0 0.1em; border-radius: 3px }
.hl-1 { color: var(--hl1); background: linear-gradient(transparent 58%, var(--hl1-bg) 58%) }
.hl-2 { color: var(--hl2); background: linear-gradient(transparent 58%, var(--hl2-bg) 58%) }
.hl-3 { color: var(--hl3); background: linear-gradient(transparent 58%, var(--hl3-bg) 58%) }
.hl-4 { color: var(--hl4); background: linear-gradient(transparent 58%, var(--hl4-bg) 58%) }

/* what it does: input → output */
.io { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 6px 0 20px; font-size: 1.05rem }
.io .box { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 14px; background: #fff; font-weight: 600 }
.io .arrow { font-size: 1.4rem; color: var(--muted) }

/* where it fits: needs → this skill → leads to */
.fit { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 14px; align-items: center; margin: 10px 0 18px }
.fit h3 { margin: 0 0 8px; font-size: 0.72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.fit ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.chip { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 0.92rem; font-weight: 600; color: var(--ink); text-decoration: none }
a.chip:hover { border-color: var(--ink) }
.chip .grade { font-size: 0 }
.this { padding: 14px 16px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 700; text-align: center; font-size: 0.98rem }
.fit .to { font-size: 1.5rem; color: var(--muted) }
.fit .none { font-size: 0.9rem; color: var(--muted); padding: 9px 2px }
@media (max-width: 900px) { .fit { grid-template-columns: minmax(0, 1fr) } .fit .to { transform: rotate(90deg); justify-self: center } }

.grade { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; color: var(--soft); white-space: nowrap }
.grade .dots { display: inline-flex; gap: 3px }
.grade i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink) }
.grade i.on { background: var(--ink) }
.this .grade, .this .grade i { color: #fff; border-color: #fff }
.this .grade i.on { background: #fff }

/* in the exam: one dot per year per level, size = number of parts */
.stat { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 14px }
.stat .big { font-size: clamp(2.6rem, 6vw, 3.8rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1 }
.stat .of { font-size: 1.05rem; font-weight: 600; color: var(--soft) }
.years { display: grid; grid-template-columns: 34px repeat(11, minmax(0, 1fr)); gap: 6px 4px; align-items: center; max-width: 620px; margin: 4px 0 16px }
.years .yl { font-size: 0.7rem; font-weight: 800; color: var(--muted) }
.years .yr { font-family: var(--mono); font-size: 0.66rem; color: var(--muted); text-align: center }
.years .d { justify-self: center; border-radius: 50%; background: var(--ink) }
.years .d.none { background: transparent; border: 1.5px dashed #c9c2b6; width: 12px !important; height: 12px !important }

/* worked example: steps on the left, the graph drawing itself on the right */
.question { border-left: 4px solid var(--ink); padding: 6px 0 6px 16px; margin: 4px 0 22px }
.question .say { margin: 0 }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 380px); gap: 28px; align-items: start }
.ex .graph { position: sticky; top: 20px }
.ex.solo { grid-template-columns: minmax(0, 1fr) }
@media (max-width: 1100px) { .ex { grid-template-columns: minmax(0, 1fr) } .ex .graph { position: static; order: -1; max-width: 420px } }
.step { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 0 12px; margin: 0 0 18px }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font-weight: 800; font-size: 0.8rem; margin-top: 3px }
.step .say { font-size: 1.08rem; margin-bottom: 4px }
.graph svg { width: 100%; height: auto; display: block; overflow: visible }
.graph text { font-family: var(--font); font-size: 13px; fill: var(--pencil) }
.graph .tick { font-size: 11px; fill: var(--muted) }
.graph .lab { font-weight: 700 }
.answer { display: inline-flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 12px 18px; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; margin: 4px 0 0 44px; font-size: 1.1rem }
.answer small { font-size: 0.66rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }

/* exam tips */
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; max-width: 760px }
.tips li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start }
.tips .k { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 800; font-size: 0.8rem; display: grid; place-items: center; margin-top: 3px }
.tips .say { margin: 0 }
.tips .src { margin: 4px 0 0; font-size: 0.8rem; color: var(--muted) }

.next { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 0.98rem; cursor: pointer; text-decoration: none; display: inline-flex; gap: 8px; align-items: center }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 16px rgba(250, 76, 6, .28) }
.btn-primary:hover { background: var(--accent-strong) }
.btn-plain { background: #fff; color: var(--ink); border: 1.5px solid #cfc8bd }

/* playback controls */
.controls { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: var(--ink); box-shadow: 0 10px 30px rgba(26, 25, 22, .25) }
.controls button { border: 0; background: transparent; color: #fff; font-weight: 700; font-size: 0.86rem; padding: 9px 15px; border-radius: 999px; cursor: pointer; min-width: 44px }
.controls button:hover, .controls button:focus-visible { background: rgba(255,255,255,.14); outline: none }
.controls .sep { width: 1px; background: rgba(255,255,255,.18); margin: 6px 2px }

.controls button { white-space: nowrap }
.controls [hidden] { display: none }
/* phones: the working gets the full width (step number above it) and a slightly smaller size */
@media (max-width: 600px) {
  .step { grid-template-columns: minmax(0, 1fr) }
  .step .n { margin: 0 0 6px }
  .work { font-size: 0.98rem }
  .answer { margin-left: 0 }
  .controls button { padding: 9px 11px; font-size: 0.82rem }
}
@media (prefers-reduced-motion: reduce) { .w, .pop { transition: none !important } }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="maths-skill.html">← All skills</a>
  <div class="phases" aria-label="Skill phases"><span class="now" aria-current="step">1 · Learn</span><a id="practise" hidden>2 · Practice Problems</a><span id="practise-none">2 · Practice Problems</span></div>
</header>
<div class="wrap">
  <ol class="rail" id="rail" aria-label="Sections">
    <li data-s="what">What it does</li><li data-s="fit">Where it fits</li><li data-s="exam">In the exam</li>
    <li data-s="example">Worked example</li><li data-s="tips">Exam tips</li>
  </ol>
  <main class="board" id="board" aria-live="polite"></main>
</div>
<nav class="controls" aria-label="Playback">
  <button id="play" aria-label="Pause">Pause</button>
  <button id="speed" aria-label="Speed">1×</button>
  <span class="sep"></span>
  <button id="all">Show all</button>
  <button id="replay" aria-label="Replay from the start">Replay</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="maths-learn.js"></script>
<script>
// the student's maths level from onboarding (app.js saves the whole state under this key); Higher until they choose
const LEVEL = (() => {
  try {
    const app = JSON.parse(localStorage.getItem('bare-bones-app-v4')) || {};
    return app.usersByName?.[app.session?.currentUser]?.onboarding?.levels?.maths === 'ordinary' ? 'ordinary' : 'higher';
  } catch { return 'higher' }
})();

// one skill's Learn data (maths-learn.js); an unknown id goes back to the skill list
const SKILL = (window.MATHS_LEARN || {})[new URLSearchParams(location.search).get('skill')];
if (!SKILL) { location.replace('maths-skill.html'); throw new Error('no such skill') }
document.title = `Learn: ${SKILL.title}`;
if (SKILL.lesson) { const a = document.getElementById('practise'); a.href = `maths-skill.html?skill=${SKILL.id}`; a.hidden = false; document.getElementById('practise-none').remove() }
else document.querySelector('.phases').lastElementChild.remove();   // constructions and proofs: Learn only
if (!(SKILL.tips[LEVEL] || []).length) document.querySelector('#rail [data-s=tips]').remove();
const LEVEL_NAME = { higher: 'Higher', ordinary: 'Ordinary' };
const COURSE = { JC: 'Junior Cycle, assumed at Leaving Cert', OL: 'Ordinary and Higher', HL: 'Higher only' };

const KATEX_OPTS = { throwOnError: false, strict: 'ignore', macros: { '\\hl': '\\htmlClass{hl hl-#1}{#2}' }, trust: c => c.command === '\\htmlClass' };
const tex = (s, display = false) => katex.renderToString(s, { ...KATEX_OPTS, displayMode: display });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const GRADES = ['Beginner', 'Intermediate', 'Advanced'];
const gradeTag = g => `<span class="grade" title="${g}"><span class="dots" aria-hidden="true">${GRADES.map((_, k) =>
  `<i class="${k <= GRADES.indexOf(g) ? 'on' : ''}"></i>`).join('')}</span>${g}</span>`;
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ── playback engine: every wait and animation goes through here, so pause / speed / show-all / replay work everywhere ──
const run = { token: 0, speed: 1, paused: false, skip: false, anims: new Set(), wake: null };
class Cancel extends Error {}
const alive = tok => { if (tok !== run.token) throw new Cancel() };

async function sleep(ms, tok) {
  let left = ms;
  while (left > 0) {
    alive(tok);
    if (run.skip) return;
    if (run.paused) { await new Promise(r => (run.wake = r)); continue }
    const step = Math.min(left / run.speed, 40);
    await new Promise(r => setTimeout(r, step));
    left -= step * run.speed;
  }
  alive(tok);
}

async function anim(el, frames, ms, tok, easing = 'cubic-bezier(0.22, 1, 0.36, 1)') {
  alive(tok);
  const a = el.animate(frames, { duration: ms / run.speed, easing, fill: 'forwards' });
  run.anims.add(a);
  if (run.skip) a.finish(); else if (run.paused) a.pause();
  try { await a.finished } catch { /* cancelled by replay */ }
  run.anims.delete(a);
  alive(tok);
}

const board = document.getElementById('board');
const follow = el => { if (!run.skip) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }) };

// words one at a time; $…$ is one "word" rendered as maths; **x** is bold
async function say(parent, text, tok, cls = 'say') {
  const p = h('p', cls);
  parent.append(p);
  const words = [];
  let bold = false;          // **a few words** stays bold across the word split
  for (const [k, part] of text.split(/(\$[^$]+\$)/).entries()) {
    if (k % 2) { words.push({ html: tex(part.slice(1, -1)), len: 6 }); continue }
    for (let w of part.split(/(\s+)/)) {
      if (!w) continue;
      if (/^\s+$/.test(w)) { words.push({ html: ' ', space: true }); continue }
      if (w.startsWith('**')) { bold = true; w = w.slice(2) }
      const close = /\*\*(\W*)$/.test(w);
      w = w.replace(/\*\*(\W*)$/, '$1');
      const html = bold ? `<b>${esc(w)}</b>` : esc(w), prev = words[words.length - 1];
      // ", and" right after $maths$: glue the comma to the maths so it can't wrap onto a line of its own
      if (prev && !prev.space && /^\W/.test(w)) { prev.html += html; prev.stop = /[.:?!]$/.test(w); if (close) bold = false; continue }
      words.push({ html, len: w.length, stop: /[.:?!]$/.test(w) });
      if (close) bold = false;
    }
  }
  const spans = words.map(w => { const s = h('span', w.space ? '' : 'w', w.html); p.append(s); return [s, w] });
  follow(p);
  for (const [s, w] of spans) {
    if (w.space) continue;
    s.classList.add('on');
    await sleep(70 + 16 * Math.min(w.len, 9) + (w.stop ? 260 : 0), tok);
  }
  await sleep(320, tok);
  return p;
}

async function pop(el, tok, gap = 140) { el.classList.add('pop'); requestAnimationFrame(() => el.classList.add('on')); follow(el); await sleep(gap, tok) }

// rows: {l, r} for "lhs | = rhs" aligned on =, {full} for a line on its own, {aside} for a small note
async function write(parent, rows, tok, onRow) {
  const work = h('div', 'work');
  parent.append(work);
  for (const [k, row] of rows.entries()) {
    if (row.aside) { const a = h('div', 'aside'); work.append(a); await say(a, row.aside, tok, 'say small'); continue }
    const cells = row.full != null ? [h('div', 'cell full', tex(row.full))] : [h('div', 'cell lhs', tex(row.l)), h('div', 'cell', tex(row.r))];
    for (const c of cells) { c.style.clipPath = 'inset(-0.5em 100% -0.5em -0.3em)'; work.append(c) }
    follow(work);
    for (const c of cells) {
      if (!c.textContent.trim()) { c.style.clipPath = 'none'; continue }
      const pen = h('i', 'pen');
      c.append(pen);
      const ms = Math.min(1500, Math.max(260, c.offsetWidth * 5.5));
      pen.style.opacity = 1;
      await Promise.all([
        anim(c, [{ clipPath: 'inset(-0.5em 100% -0.5em -0.3em)' }, { clipPath: 'inset(-0.5em -0.3em -0.5em -0.3em)' }], ms, tok, 'linear'),
        anim(pen, [{ left: '0%' }, { left: '100%' }], ms, tok, 'linear'),
      ]);
      pen.remove();
    }
    if (onRow) await onRow(k);
    await sleep(260, tok);
  }
  return work;
}

function section(key, label) {
  for (const li of document.querySelectorAll('#rail li')) {
    const order = [...li.parentNode.children].indexOf(li), now = [...li.parentNode.children].findIndex(x => x.dataset.s === key);
    li.classList.toggle('done', order < now);
    if (order === now) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
  }
  const s = h('section', 'sec');
  if (label) s.append(h('span', 'lbl', label));
  board.append(s);
  return s;
}

// ── pencil drawing: paths draw themselves (stroke-dashoffset); text stays clean ──
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent?.append(e); return e };
async function draw(path, ms, tok) {
  const len = path.getTotalLength();
  path.style.strokeDasharray = `${len} ${len}`;
  await anim(path, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], ms, tok, 'ease-in-out');
}
async function fadeIn(el, ms, tok) { el.style.opacity = 0; await anim(el, [{ opacity: 0 }, { opacity: 1 }], ms, tok) }

function plot(f, box, W, H) {
  const [x0, x1, y0, y1] = box, span = y1 - y0;
  const sx = x => ((x - x0) / (x1 - x0)) * W, sy = y => ((y1 - y) / (y1 - y0)) * H;
  let d = '', prev = null;
  for (let i = 0; i <= 480; i++) {
    const x = x0 + ((x1 - x0) * i) / 480, y = f(x);
    // lift the pencil where f is undefined, far off the graph, or jumps (an asymptote)
    if (!Number.isFinite(y) || y < y0 - span || y > y1 + span || (prev != null && Math.abs(y - prev) > span)) { prev = null; continue }
    d += `${prev == null ? 'M' : 'L'}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`;
    prev = y;
  }
  return { sx, sy, d };
}

// static text with $maths$ and **bold** (labels, answers, chips)
const rich = s => String(s).split(/(\$[^$]+\$)/).map((p, k) => k % 2 ? tex(p.slice(1, -1)) : esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')).join('');
const fmt = v => String(Math.round(v * 100) / 100).replace('-', '−');
const listing = xs => xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;
const NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
const count = (n, word) => `${NUM[n] ?? n} ${word}${n === 1 ? '' : 's'}`;

// the worked example's graph (SKILL.graph): drawn once, then each point's guides appear when its colour first turns up in the working
function exampleGraph(parent, G) {
  const W = 360, H = 320, [xmin, ymax, xmax, ymin] = G.box;
  const f = new Function('x', `return ${G.f}`), P = plot(f, [xmin, xmax, ymin, ymax], W, H);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ax = P.sy(clamp(0, ymin, ymax)), ay = P.sx(clamp(0, xmin, xmax));     // axes sit at 0, or on the edge when 0 is off the graph
  const svg = svgEl('svg', { viewBox: `-26 -16 ${W + 52} ${H + 34}`, role: 'img', 'aria-label': 'Graph of the function in the question' });
  parent.append(svg);
  svgEl('clipPath', { id: 'clipbox' }, svg).append(svgEl('rect', { x: 0, y: 0, width: W, height: H }));
  const g = svgEl('g', { filter: 'url(#pencil)' }, svg), C = n => css(`--hl${n}`), pencil = css('--pencil');
  const line = (x1, y1, x2, y2, stroke, w = 1.6) => svgEl('path', { d: `M${x1},${y1}L${x2},${y2}`, stroke, 'stroke-width': w, fill: 'none', 'stroke-linecap': 'round' }, g);
  const text = (x, y, s, attrs = {}) => { const t = svgEl('text', { x, y, ...attrs }, svg); t.textContent = s; return t };
  const pts = G.points || [], slot = G.slots || {}, shown = {};
  const above = p => f(p.x) >= (f(p.x - 0.05) + f(p.x + 0.05)) / 2;          // a max or a rising point: label above
  const anchor = p => P.sx(p.x) < 50 ? 'start' : P.sx(p.x) > W - 50 ? 'end' : 'middle';
  const G_ = {
    async axes(tok) {
      await Promise.all([draw(line(0, ax, W, ax, pencil, 1.5), 600, tok), draw(line(ay, H, ay, 0, pencil, 1.5), 600, tok)]);
      await Promise.all([fadeIn(text(W + 6, ax + 4, 'x'), 250, tok), fadeIn(text(ay + 6, -4, 'y'), 250, tok)]);
    },
    async curve(tok) {
      await draw(svgEl('path', { d: P.d, fill: 'none', stroke: pencil, 'stroke-width': 2.6, 'stroke-linecap': 'round', 'clip-path': 'url(#clipbox)' }, g), 1800, tok);
    },
    async xs(tok) {           // x of each point, dashed down to the x-axis
      if (shown.x) return; shown.x = true;
      for (const p of pts) {
        const v = line(P.sx(p.x), ax, P.sx(p.x), P.sy(p.y), C(slot.x), 2.2);
        v.setAttribute('stroke-dasharray', '5 5');
        await anim(v, [{ opacity: 0 }, { opacity: 1 }], 350, tok);
        const t = text(P.sx(p.x), ax + (P.sy(p.y) < ax ? 16 : -8), fmt(p.x), { 'text-anchor': 'middle', class: 'lab' });
        t.style.fill = C(slot.x);
        await fadeIn(t, 250, tok);
      }
    },
    async ys(tok) {           // y of each point, dotted across to the y-axis, then the point itself
      if (shown.y) return; shown.y = true;
      for (const p of pts) {
        const left = P.sx(p.x) < ay;
        if (slot.y) {
          const hz = line(ay, P.sy(p.y), P.sx(p.x), P.sy(p.y), C(slot.y), 2.2);
          hz.setAttribute('stroke-dasharray', '2 5');
          await anim(hz, [{ opacity: 0 }, { opacity: 1 }], 350, tok);
          const t = text(ay + (left ? 6 : -6), P.sy(p.y) + (above(p) ? -6 : 16), fmt(p.y), { 'text-anchor': left ? 'start' : 'end', class: 'lab' });
          t.style.fill = C(slot.y);
          await fadeIn(t, 250, tok);
        }
        const dot = svgEl('circle', { cx: P.sx(p.x), cy: P.sy(p.y), r: 5, fill: pencil }, svg);
        await anim(dot, [{ r: 0 }, { r: 5 }], 300, tok);
      }
    },
    async names(tok) {        // finally, what each point is
      if (slot.x) await G_.xs(tok);
      await G_.ys(tok);
      for (const p of pts) if (p.name) await fadeIn(text(P.sx(p.x), P.sy(p.y) + (above(p) ? -14 : 22), p.name, { 'text-anchor': anchor(p), class: 'lab' }), 350, tok);
    },
    // called after each row of working: a slot's colour appearing means that number has just been found
    async row(src, tok) {
      if (slot.x && src.includes(`\\hl{${slot.x}}`)) await G_.xs(tok);
      if (slot.y && src.includes(`\\hl{${slot.y}}`)) await G_.ys(tok);
    },
  };
  return G_;
}

// a geometry figure or finished construction (SKILL.diagram): every line draws itself, then the labels appear
async function figure(parent, svgText, tok) {
  parent.innerHTML = svgText;
  const svg = parent.querySelector('svg');
  if (!svg) return;
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Figure for the worked example');
  const shapes = [...svg.querySelectorAll('path, line, circle, ellipse, polyline, polygon, rect')].filter(s => s.getTotalLength);
  const labels = [...svg.querySelectorAll('text')];
  for (const s of shapes) { const len = s.getTotalLength(); s.style.strokeDasharray = `${len} ${len}`; s.style.strokeDashoffset = len }
  labels.forEach(t => (t.style.opacity = 0));
  for (const s of shapes) await draw(s, 420, tok);
  await Promise.all(labels.map(t => fadeIn(t, 300, tok)));
}

// ── the lesson script: the same five sections for every skill, filled from SKILL ──
async function lesson(tok) {
  const name = LEVEL_NAME[LEVEL];

  // title
  const top = section('what');
  top.style.marginBottom = '26px';
  const kick = h('p', 'kicker', `${esc(SKILL.chapter)} · skill ${SKILL.rank} of ${SKILL.ofRank}`);
  top.append(kick); await pop(kick, tok, 300);
  const h1 = h('h1'); top.append(h1);
  for (const w of SKILL.title.split(' ')) { const s = h('span', 'w', esc(w) + ' '); h1.append(s); requestAnimationFrame(() => s.classList.add('on')); await sleep(120, tok) }
  const meta = h('div', '', `${gradeTag(SKILL.grade)} <span class="grade" style="margin-left:14px">${COURSE[SKILL.level]}</span>`);
  top.append(meta); await pop(meta, tok, 500);

  // 1. what it does
  const what = section('what', 'What it does');
  const [first, ...rest] = SKILL.what.say;
  await say(what, first, tok);
  const io = h('div', 'io', `<span class="box">${rich(SKILL.what.in)}</span><span class="arrow" aria-hidden="true">→</span><span class="box">${rich(SKILL.what.out)}</span>`);
  what.append(io); await pop(io, tok, 400);
  for (const s of rest) await say(what, s, tok);

  // 2. where it fits
  const fit = section('fit', 'Where it fits');
  const nN = SKILL.needs.length, nL = SKILL.leadsTo.length;
  await say(fit, `${nN ? `You need ${count(nN, 'smaller skill')} first.` : 'You can start this one straight away: it needs no earlier skill.'} ${
    nL ? `Once you have it, it opens up ${NUM[nL] ?? nL} more.` : 'No later skill builds on it.'}`, tok);
  const grid = h('div', 'fit'); fit.append(grid);
  const chip = n => h('li', '', `<${n.lesson ? `a href="maths-learn.html?skill=${n.id}"` : 'span'} class="chip">${esc(n.title)} ${gradeTag(n.grade)}</${n.lesson ? 'a' : 'span'}>`);
  const column = async (title, items, none) => {
    const c = h('div', '', `<h3>${title}</h3>`), ul = h('ul'); c.append(ul); grid.append(c);
    if (!items.length) ul.append(h('li', 'none', none));
    for (const n of items) { const li = chip(n); ul.append(li); await pop(li, tok, 220) }
  };
  const arrow = async () => { const a = h('span', 'to', '→'); a.setAttribute('aria-hidden', 'true'); grid.append(a); await pop(a, tok, 200) };
  await column('You need', SKILL.needs, 'Nothing first');
  await arrow();
  const me = h('div', 'this', `${esc(SKILL.title)}<br>${gradeTag(SKILL.grade)}`); grid.append(me); await pop(me, tok, 300);
  await arrow();
  await column('It leads to', SKILL.leadsTo, 'Nothing after it');
  await sleep(400, tok);

  // 3. in the exam: only the student's own level
  const exam = section('exam', 'In the exam');
  const E = SKILL.exam[LEVEL], years = E.byYear.map((n, k) => [2015 + k, n]);
  const askedIn = years.filter(([, n]) => n).map(([y]) => y), parts = E.byYear.reduce((a, b) => a + b, 0);
  if (SKILL.level === 'HL' && LEVEL === 'ordinary') {
    await say(exam, 'This is a **Higher Level** skill. It is not on the Ordinary Level course, so it will not come up on your paper.', tok);
  } else {
    const stat = h('div', 'stat', `<span class="big">${askedIn.length} of ${years.length}</span><span class="of">${name} Level exams, 2015–2025</span>`);
    exam.append(stat); await pop(stat, tok, 400);
    const row = h('div', 'years'); exam.append(row);
    row.style.gridTemplateColumns = `repeat(${years.length}, minmax(0, 1fr))`;
    for (const [y] of years) row.append(h('span', 'yr', `’${String(y).slice(2)}`));
    for (const [y, n] of years) {
      const d = h('span', `d${n ? '' : ' none'}`);
      d.style.width = d.style.height = `${8 + n * 5}px`;
      d.title = `${y}: ${n ? n + ' part' + (n > 1 ? 's' : '') : 'not asked'}`;
      row.append(d); await pop(d, tok, 70);
    }
    const missed = years.filter(([, n]) => !n).map(([y]) => y);
    const when = !askedIn.length ? null : !missed.length ? `on **every ${name} paper**` : missed.length <= 3 ? `on every ${name} paper except ${listing(missed)}`
      : askedIn.length <= 4 ? `in ${listing(askedIn)}` : `in ${askedIn.length} of the ${years.length} years`;
    await say(exam, when ? `It came up ${when}: ${count(parts, 'exam part')}.${askedIn.length > 1 ? ' A bigger dot means more parts that year.' : ''}`
      : `It has not come up on a ${name} Level paper since 2015. It is on the course, so it still could.`, tok);
    if (SKILL.how[LEVEL]) await say(exam, SKILL.how[LEVEL], tok, 'say small');
  }

  // 4. worked example
  const ex = section('example', 'Worked example');
  const q = h('div', 'question'); ex.append(q);
  for (const line of SKILL.example.question.split('\n').filter(s => s.trim())) await say(q, line, tok);
  const side = SKILL.graph || SKILL.diagram;
  const layout = h('div', side ? 'ex' : 'ex solo'); ex.append(layout);
  const intro = h('div'), steps = h('div'), gbox = h('div', 'graph');
  ex.insertBefore(intro, layout); layout.append(steps);   // the intro sits above the figure even when the figure moves above the steps on phones
  let graph = null;
  if (SKILL.graph) {
    layout.append(gbox);
    graph = exampleGraph(gbox, SKILL.graph);
    await say(intro, 'Here is the graph, so you can see what you are looking for.', tok, 'say small');
    await graph.axes(tok); await graph.curve(tok);
  } else if (SKILL.diagram) {
    layout.append(gbox);
    await say(intro, SKILL.id.startsWith('con-') ? 'This is what you will end up with.' : 'Here is the figure.', tok, 'say small');
    await figure(gbox, SKILL.diagram, tok);
  }
  for (const [k, st] of SKILL.example.steps.entries()) {
    const s = h('div', 'step', `<span class="n">${k + 1}</span>`), body = h('div'); s.append(body); steps.append(s);
    await pop(s, tok, 80); await say(body, st.say, tok);
    await write(body, st.rows, tok, graph && (r => graph.row(Object.values(st.rows[r]).join(' '), tok)));
  }
  if (graph) await graph.names(tok);
  const fin = SKILL.example.final;
  const ans = h('div', 'answer', `<small>Answer</small>${fin.includes('$') ? rich(fin) : tex(fin)}`);
  steps.append(ans); await pop(ans, tok, 600);

  // 5. exam tips from the marking schemes (the rail hides this when the level has none)
  const T = SKILL.tips[LEVEL] || [];
  if (T.length) {
    const tips = section('tips', 'Exam tips');
    const ul = h('ul', 'tips'); tips.append(ul);
    for (const [k, t] of T.entries()) {
      const li = h('li', '', `<span class="k">${k + 1}</span>`), body = h('div'); li.append(body); ul.append(li);
      await pop(li, tok, 60); await say(body, t.tip, tok);
      const src = h('p', 'src', `From the ${listing(t.years.map(String))} ${name} Level marking scheme${t.years.length > 1 ? 's' : ''}`);
      body.append(src); await pop(src, tok, 200);
    }
  }

  for (const li of document.querySelectorAll('#rail li')) { li.classList.add('done'); li.removeAttribute('aria-current') }
  const go = SKILL.lesson ? `<a class="btn btn-primary" href="maths-skill.html?skill=${SKILL.id}">Practice Problems →</a>`
    : `<a class="btn btn-primary" href="maths-skill.html">All skills →</a>`;
  const next = h('div', 'next', `${go}<button class="btn btn-plain" data-act="replay">Watch again</button>`);
  board.append(next); await pop(next, tok, 0);
  setState('done');
}

// ── controls ──
const $ = id => document.getElementById(id);
function setState(s) {
  $('play').textContent = s === 'playing' ? 'Pause' : s === 'paused' ? 'Play' : 'Replay';
  $('play').setAttribute('aria-label', $('play').textContent);
  $('play').hidden = s === 'done';          // the Replay button already covers it
  $('all').disabled = s === 'done';
  $('all').style.opacity = s === 'done' ? 0.4 : 1;
  run.state = s;
}
function pause() { run.paused = true; run.anims.forEach(a => a.pause()); setState('paused') }
function resume() { run.paused = false; run.anims.forEach(a => a.play()); run.wake?.(); setState('playing') }
function showAll() {
  run.skip = true; document.body.classList.add('instant');
  if (run.paused) { run.paused = false; run.wake?.() }
  run.anims.forEach(a => a.finish());
}
function start(skip = false) {
  run.token++; run.anims.forEach(a => a.cancel()); run.anims.clear();
  Object.assign(run, { paused: false, skip });
  document.body.classList.toggle('instant', skip);
  board.innerHTML = '';
  window.scrollTo({ top: 0 });
  setState('playing');
  const tok = run.token;
  lesson(tok).catch(e => { if (!(e instanceof Cancel)) throw e });
}
$('play').onclick = () => (run.state === 'playing' ? pause() : run.state === 'paused' ? resume() : start());
$('speed').onclick = () => { run.speed = run.speed === 1 ? 1.5 : run.speed === 1.5 ? 2 : 1; $('speed').textContent = `${run.speed}×`;
  run.anims.forEach(a => a.updatePlaybackRate(run.speed)) };
$('all').onclick = showAll;
$('replay').onclick = () => start();
board.addEventListener('click', e => { if (e.target.closest('[data-act=replay]')) start() });
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').click() } });

// reduced motion: the whole board at once, no writing animation
start(matchMedia('(prefers-reduced-motion: reduce)').matches);
</script>
