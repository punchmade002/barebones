<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill: Turning points</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.8.0/distrib/jsxgraph.css" />
<!-- Prototype of the maths skill lesson (skills DB: pipeline/requirements/maths). Self-contained on purpose. -->
<style>
:root {
  --bg: #EDEBE6; --panel: #FFFFFF; --ink: #1A1916; --muted: #7A7870; --line: #DEDAD2;
  --accent: #fa4c06; --accent-strong: #c23504; --accent-xlight: #fff0e6;
  --paper: #fffdfa; --grid: rgba(82, 64, 51, 0.06); --margin: #e7a3a3;
  /* highlighter slots: a term keeps its slot from line to line and on the graph */
  --hl1: #d9480f; --hl1-bg: #ffe3d3;
  --hl2: #1c5fd1; --hl2-bg: #dce8ff;
  --hl3: #0f7a4a; --hl3-bg: #d5f2e3;
  --hl4: #7c3aed; --hl4-bg: #ece3ff;
  --font: 'Outfit', system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-sm: 12px; --r-md: 18px; --r-lg: 24px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 80px; }

/* skill header */
.skill-head { display: grid; gap: 10px; margin-bottom: 22px; }
.kicker { color: var(--accent-strong); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
.skill-head h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.5rem); line-height: 1.08; letter-spacing: -0.025em; font-weight: 800; }
.io { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.io b { color: var(--ink); font-weight: 600; }
.head-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

/* progress pips */
.pips { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.pips li { font-size: 0.72rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: #e2dfd8; color: var(--muted); }
.pips li.on { background: var(--ink); color: #fff; }
.pips li.past { background: #d6d2c9; color: var(--ink); text-decoration: line-through; text-decoration-thickness: 1.5px; }

.chip-btn { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 0.82rem; transition: background .18s var(--ease); }
.chip-btn:hover, .chip-btn[aria-expanded="true"] { background: var(--ink); color: #fff; }

.necessary { background: var(--panel); border-radius: var(--r-md); padding: 16px 18px; border: 1px solid var(--line); display: grid; gap: 12px; animation: rise .35s var(--ease); }
.necessary h2 { margin: 0; font-size: 0.95rem; }
.necessary p { margin: 0; color: var(--muted); font-size: 0.85rem; }
.nec-group { display: grid; gap: 6px; }
.nec-group h3 { margin: 0; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.nec-list { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.nec-list li { display: inline-flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 10px; background: #f4f2ee; font-size: 0.84rem; }
.lvl { font-family: var(--mono); font-size: 0.62rem; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: #fff; border: 1px solid var(--line); color: var(--muted); }

/* banner: what's different */
.diff { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--ink); color: #fff; border-radius: var(--r-md); padding: 14px 18px; margin-bottom: 16px; animation: rise .4s var(--ease); }
.diff .tag { background: var(--accent); color: #fff; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.diff p { margin: 0; font-size: 0.95rem; }

/* layout */
.grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 980px) { .grid.walk { grid-template-columns: minmax(0, 1fr) 400px; } .side { position: sticky; top: 16px; } }

.card { background: var(--panel); border-radius: var(--r-lg); border: 1px solid var(--line); overflow: hidden; }
.card-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.card-head strong { font-size: 0.95rem; }
.card-head span { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.crops { display: grid; gap: 0; background: #fff; }
.crops img { width: 100%; height: auto; display: block; border-bottom: 1px solid #f0ede8; }
.part-note { margin: 0; padding: 12px 18px; background: var(--accent-xlight); color: var(--accent-strong); font-weight: 700; font-size: 0.9rem; }

/* copybook prompt */
.copybook { position: relative; border-radius: var(--r-lg); padding: 22px 22px 22px 64px; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; border: 1px solid var(--line); animation: rise .4s var(--ease); }
.copybook::before { content: ""; position: absolute; left: 44px; top: 0; bottom: 0; width: 2px; background: var(--margin); }
.copybook h2 { margin: 0 0 6px; font-size: 1.25rem; letter-spacing: -0.01em; }
.copybook ol { margin: 0 0 16px; padding-left: 18px; color: #433c36; }
.copybook li { margin: 2px 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; font-size: 0.92rem; transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 18px rgba(250, 76, 6, 0.3); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid #cfcac1; }
.btn-ghost:hover { border-color: var(--ink); }
.btn-quiet { background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 11px 6px; }
.answer-peek { margin-top: 14px; padding: 12px 14px; background: #fff; border-radius: var(--r-sm); border: 1px dashed #cfcac1; }
.answer-peek small { display: block; color: var(--muted); font-size: 0.75rem; margin-bottom: 4px; }

/* walkthrough */
.solution { background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: rgba(255,253,250,.96); }
.legend button { border: 0; background: transparent; padding: 0; }
.steps { list-style: none; margin: 0; padding: 6px 0 10px; counter-reset: step; }
.step { padding: 14px 18px 12px 60px; position: relative; counter-increment: step; opacity: 0; animation: rise .45s var(--ease) forwards; }
.step + .step { border-top: 1px dashed #e8ddd5; }
.step::before { content: counter(step); position: absolute; left: 18px; top: 14px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font-weight: 800; font-size: 0.8rem; }
.step h3 { margin: 3px 0 6px; font-size: 1rem; letter-spacing: -0.005em; }
.step p { margin: 6px 0; color: #433c36; }
.step .katex-display { margin: 6px 0; text-align: left; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.step .katex-display > .katex { text-align: left; }
.final { margin: 4px 18px 18px; padding: 12px 16px; border: 2px solid var(--ink); border-radius: var(--r-sm); background: #fff; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.final small { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* highlighter terms: colour + tinted band + a distinct underline, so colour is never the only cue */
.hl { padding: 0 0.12em; border-radius: 3px; transition: opacity .15s, box-shadow .15s; }
.hl-1 { color: var(--hl1); background: linear-gradient(transparent 52%, var(--hl1-bg) 52%); border-bottom: 2px solid var(--hl1); }
.hl-2 { color: var(--hl2); background: linear-gradient(transparent 52%, var(--hl2-bg) 52%); border-bottom: 2px dashed var(--hl2); }
.hl-3 { color: var(--hl3); background: linear-gradient(transparent 52%, var(--hl3-bg) 52%); border-bottom: 2px dotted var(--hl3); }
.hl-4 { color: var(--hl4); background: linear-gradient(transparent 52%, var(--hl4-bg) 52%); border-bottom: 3px double var(--hl4); }
[data-focus] .hl { opacity: 0.28; }
[data-focus="1"] .hl-1, [data-focus="2"] .hl-2, [data-focus="3"] .hl-3, [data-focus="4"] .hl-4 { opacity: 1; box-shadow: 0 0 0 2px currentColor; }
.key { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; color: var(--ink); }
.key .hl { font-family: var(--mono); font-size: 0.75rem; font-weight: 700; }

/* graph */
.graph-card .board { width: 100%; aspect-ratio: 1 / 0.92; border: 0; border-radius: 0; background: var(--paper); }
.readout { padding: 12px 16px 14px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.readout .big { font-family: var(--mono); font-size: 1rem; font-weight: 700; }
.readout .big .hl { font-size: 1rem; }
.readout p { margin: 0; font-size: 0.82rem; color: var(--muted); }
.readout .zero { color: var(--hl1); font-weight: 700; }

.verdict { margin-top: 18px; background: var(--panel); border-radius: var(--r-lg); border: 1px solid var(--line); padding: 18px; display: grid; gap: 12px; }
.verdict h2 { margin: 0; font-size: 1.05rem; }
.verdict p { margin: 0; color: var(--muted); font-size: 0.9rem; }

.end { background: var(--panel); border-radius: var(--r-lg); border: 1px solid var(--line); padding: 26px; display: grid; gap: 14px; animation: rise .4s var(--ease); }
.end h2 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
.end p { margin: 0; color: #433c36; }
.tick { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; }
.under { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.under li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--r-sm); background: #f4f2ee; }
.under li span { font-weight: 600; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } .step { opacity: 1; } }
@media (max-width: 560px) { .copybook { padding-left: 50px; } .copybook::before { left: 34px; } .step { padding-left: 52px; } .step::before { left: 14px; } }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.8.0/distrib/jsxgraphcore.js"></script>
<script>
// Lesson data. Steps are the bank's worked solutions with \hl{slot}{…} marks added by hand.
// shortcut: hand-written for one skill; generate from skill-tags.json + bank once the format is agreed.
const LESSON = {
  skill: { id: 'diff-stationary', title: 'Find and classify turning points', level: 'OL + HL',
    input: 'f(x)', output: 'max/min points via f′ = 0 and f″' },
  necessary: [
    { depth: 1, id: 'diff-second', title: 'Find the second derivative', level: 'OL' },
    { depth: 1, id: 'quad-solve-factor', title: 'Solve a quadratic by factorising', level: 'OL' },
    { depth: 1, id: 'fn-evaluate', title: 'Evaluate a function', level: 'OL' },
    { depth: 2, id: 'diff-poly', title: 'Differentiate a polynomial by rule', level: 'OL' },
    { depth: 2, id: 'alg-factor-quadratic', title: 'Factorise a quadratic trinomial', level: 'OL' },
    { depth: 2, id: 'alg-evaluate', title: 'Evaluate an expression', level: 'OL' },
    { depth: 3, id: 'ind-laws', title: 'Apply the laws of indices', level: 'OL' },
    { depth: 3, id: 'alg-expand-binomials', title: 'Multiply out two brackets', level: 'OL' },
    { depth: 3, id: 'num-order-operations', title: 'Apply order of operations', level: 'JC' },
    { depth: 4, id: 'alg-expand-single', title: 'Expand a bracket by a term', level: 'JC' },
    { depth: 5, id: 'alg-collect-like', title: 'Collect like terms', level: 'JC' },
  ],
  problems: [
    {
      source: 'LC Ordinary 2021 · Paper 1 · Q5', part: '(c)', marks: 10,
      images: ['exam-images/maths/2021/ordinary-p1-q5-1.webp', 'exam-images/maths/2021/ordinary-p1-q5-2.webp'],
      legend: { 1: 'the slope, f′(x)', 2: 'x at the turning point', 3: 'y at the turning point', 4: 'max or min test' },
      graph: { f: x => 3 * x * x - 6 * x + 7, df: x => 6 * x - 6, box: [-0.9, 16, 2.9, -1.5], start: 2.3,
        points: [{ x: 1, y: 4, name: 'min (1, 4)' }] },
      steps: [
        { title: 'Differentiate f(x)', lines: [
          { tex: 'f(x) &= 3x^2 - 6x + 7' },
          { tex: '\\hl{1}{f\'(x)} &= \\hl{1}{6x - 6}' } ] },
        { title: 'Set the derivative equal to 0', lines: [
          { text: 'At a turning point the slope is 0.' },
          { tex: '\\hl{1}{6x - 6} &= \\hl{1}{0}' },
          { tex: '6x &= 6' },
          { tex: '\\hl{2}{x} &= \\hl{2}{1}' } ] },
        { title: 'Find the y-co-ordinate', lines: [
          { text: 'Put $\\hl{2}{x = 1}$ back into the original $f(x)$, not into $f\'(x)$.' },
          { tex: 'f(\\hl{2}{1}) &= 3(\\hl{2}{1})^2 - 6(\\hl{2}{1}) + 7' },
          { tex: '&= 3 - 6 + 7' },
          { tex: '&= \\hl{3}{4}' } ] },
        { title: 'Check that it is a minimum', lines: [
          { tex: '\\hl{4}{f\'\'(x)} &= \\hl{4}{6}' },
          { text: '$\\hl{4}{f\'\'(1) = 6 > 0}$, so the turning point is a local minimum.' } ] },
      ],
      final: '(\\hl{2}{1},\\ \\hl{3}{4}) \\text{ — local minimum}',
    },
    {
      source: 'LC Ordinary 2025 · Paper 1 · Q8', part: '(b)(i), (ii)', marks: 15,
      images: ['exam-images/maths/2025/ordinary-p1-q8-1.webp', 'exam-images/maths/2025/ordinary-p1-q8-2.webp', 'exam-images/maths/2025/ordinary-p1-q8-3.webp'],
      diff: 'The x² term is negative (−1.5x²), so the curve is ∩-shaped and the turning point is a maximum, not a minimum. The numbers are decimals, but every step is the same.',
      legend: { 1: 'the slope, Q′(x)', 2: 'x at the turning point', 3: 'the maximum value', 4: 'max or min test' },
      graph: { f: x => -1.5 * x * x + 9.6 * x - 3.5, df: x => -3 * x + 9.6, box: [-0.5, 14.5, 6.9, -5], start: 1,
        points: [{ x: 3.2, y: 11.86, name: 'max (3.2, 11.86)' }] },
      steps: [
        { title: 'Differentiate Q(x)', lines: [
          { text: 'Use $\\frac{d}{dx}(ax^n) = anx^{n-1}$ on each term.' },
          { tex: '\\hl{1}{Q\'(x)} &= -1.5(2x) + 9.6(1) - 0' },
          { tex: '&= \\hl{1}{-3x + 9.6}' } ] },
        { title: 'Set the derivative equal to zero', lines: [
          { text: 'At the maximum the slope is zero.' },
          { tex: '\\hl{1}{-3x + 9.6} &= \\hl{1}{0}' },
          { tex: '-3x &= -9.6' },
          { tex: '\\hl{2}{x} &= \\frac{-9.6}{-3}' },
          { tex: '&= \\hl{2}{3.2}' } ] },
        { title: 'Find the maximum value', lines: [
          { text: '$\\hl{4}{\\text{The } x^2 \\text{ term is negative}}$, so the curve opens downward and $\\hl{2}{x = 3.2}$ gives a maximum.' },
          { tex: 'Q(\\hl{2}{3.2}) &= -1.5(\\hl{2}{3.2})^2 + 9.6(\\hl{2}{3.2}) - 3.5' },
          { tex: '&= -15.36 + 30.72 - 3.5' },
          { tex: '&= \\hl{3}{11.86}' } ] },
      ],
      final: 'Q\'(x) = -3x + 9.6,\\quad \\hl{2}{x = 3.2},\\quad \\hl{3}{Q(3.2) = 11.86}',
    },
    {
      source: 'LC Higher 2020 · Paper 1 · Q4', part: '(b)', marks: 5,
      images: ['exam-images/maths/2020/higher-p1-q4-1.webp', 'exam-images/maths/2020/higher-p1-q4-2.webp'],
      diff: 'f(x) is a cubic, so f′(x) is a quadratic. Solving f′(x) = 0 gives two x values, so there are two turning points. (k = −9 comes from part (a).) The question then joins the two points with a line.',
      legend: { 1: 'the slope, f′(x)', 2: 'x at each turning point', 3: 'y at each turning point', 4: 'the line g(x)' },
      graph: { f: x => x ** 3 - 9 * x * x + 15 * x + 8, df: x => 3 * x * x - 18 * x + 15, box: [-1.2, 24, 7.2, -24], start: 3,
        points: [{ x: 1, y: 15, name: 'max (1, 15)' }, { x: 5, y: -17, name: 'min (5, −17)' }],
        line: [[1, 15], [5, -17]] },
      steps: [
        { title: 'Find the turning points: set f′(x) = 0', lines: [
          { tex: '\\hl{1}{f\'(x)} &= \\hl{1}{3x^2 - 18x + 15}' },
          { tex: '\\hl{1}{3x^2 - 18x + 15} &= \\hl{1}{0}' },
          { tex: 'x^2 - 6x + 5 &= 0' },
          { tex: '(x-1)(x-5) &= 0' },
          { tex: 'x &= \\hl{2}{1} \\text{ or } x = \\hl{2}{5}' } ] },
        { title: 'Find the y-co-ordinates', lines: [
          { tex: 'f(\\hl{2}{1}) &= 1 - 9 + 15 + 8 = \\hl{3}{15}' },
          { tex: 'f(\\hl{2}{5}) &= 125 - 225 + 75 + 8 = \\hl{3}{-17}' },
          { text: 'The turning points are $(\\hl{2}{1}, \\hl{3}{15})$ and $(\\hl{2}{5}, \\hl{3}{-17})$.' } ] },
        { title: 'Find the slope of g(x)', lines: [
          { tex: 'm &= \\frac{\\hl{3}{-17} - \\hl{3}{15}}{\\hl{2}{5} - \\hl{2}{1}}' },
          { tex: 'm &= \\frac{-32}{4}' },
          { tex: 'm &= -8' } ] },
        { title: 'Find the equation of the line', lines: [
          { tex: 'y - \\hl{3}{15} &= -8(x - \\hl{2}{1})' },
          { tex: 'y - 15 &= -8x + 8' },
          { tex: '\\hl{4}{8x + y - 23} &= \\hl{4}{0}' } ] },
      ],
      final: '\\hl{4}{g(x):\\ 8x + y - 23 = 0}',
    },
  ],
};

const KATEX_OPTS = { throwOnError: false, strict: 'ignore', macros: { '\\hl': '\\htmlClass{hl hl-#1}{#2}' },
  trust: ctx => ctx.command === '\\htmlClass' };
const tex = (s, display) => katex.renderToString(s, { ...KATEX_OPTS, displayMode: display });
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inline = s => s.split(/\$([^$]+)\$/).map((bit, i) => (i % 2 ? tex(bit, false) : esc(bit))).join('');

const state = { i: 0, phase: 'attempt', peek: false, showNec: false, end: null };
const app = document.getElementById('app');
let board = null;

function stepHtml(step) {
  // consecutive tex lines share one aligned block so the = signs line up
  let html = '', run = [];
  const flush = () => { if (run.length) html += tex('\\begin{aligned}' + run.join('\\\\') + '\\end{aligned}', true); run = []; };
  for (const ln of step.lines) {
    if (ln.tex) run.push(ln.tex);
    else { flush(); html += `<p>${inline(ln.text)}</p>`; }
  }
  flush();
  return `<li class="step"><h3>${esc(step.title)}</h3>${html}</li>`;
}

function necessaryHtml() {
  const group = (label, items) => items.length ? `<div class="nec-group"><h3>${label}</h3><ul class="nec-list">${
    items.map(n => `<li>${esc(n.title)} <span class="lvl">${n.level}</span></li>`).join('')}</ul></div>` : '';
  const n = LESSON.necessary;
  return `<section class="necessary" id="nec" aria-label="Necessary Skills">
    <h2>Necessary Skills</h2>
    <p>This skill is built from these. If a line in the walkthrough loses you, the gap is usually one of them.</p>
    ${group('Used directly', n.filter(x => x.depth === 1))}
    ${group('Underneath those', n.filter(x => x.depth > 1))}
  </section>`;
}

function render() {
  const p = LESSON.problems[state.i], s = LESSON.skill;
  const pips = ['Exam problem', 'Backup 1', 'Backup 2'].map((t, k) =>
    `<li class="${k === state.i && !state.end ? 'on' : k < state.i ? 'past' : ''}">${t}</li>`).join('');
  let body = '';

  if (state.end === 'got') {
    body = `<section class="end"><div class="tick" aria-hidden="true">✓</div>
      <h2>Marked as understood</h2>
      <p>${esc(s.title)} is ticked off. It will come back in a mixed set later to check it stuck.</p>
      <div class="actions"><button class="btn btn-ghost" data-act="restart">Start this skill again</button></div></section>`;
  } else if (state.end === 'stuck') {
    const direct = LESSON.necessary.filter(n => n.depth === 1);
    body = `<section class="end"><h2>Let's build up the skills underneath</h2>
      <p>Three problems in and it hasn't clicked, which usually means one of the smaller skills is shaky. Pick the one that felt hardest:</p>
      <ul class="under">${direct.map(n => `<li><span>${esc(n.title)}</span><button class="btn btn-ghost" disabled title="Prototype: not linked yet">Practise</button></li>`).join('')}</ul>
      <div class="actions"><button class="btn btn-quiet" data-act="restart">Start this skill again</button></div></section>`;
  } else {
    const question = `<section class="card" aria-label="Exam question">
        <div class="card-head"><strong>${esc(p.source)}</strong><span>${p.marks} marks</span></div>
        <p class="part-note">Answer part ${esc(p.part)}</p>
        <div class="crops">${p.images.map((src, k) => `<img src="${src}" alt="Exam paper, ${esc(p.source)}, page ${k + 1}" loading="lazy">`).join('')}</div>
      </section>`;
    if (state.phase === 'attempt') {
      body = `<div class="grid">
        <section class="copybook">
          <h2>Copybook first</h2>
          <ol>
            <li>Answer part ${esc(p.part)} below in your copybook.</li>
            <li>Write every line, the way you would in the exam.</li>
            <li>Then open the walkthrough and check each line against yours.</li>
          </ol>
          <div class="actions">
            <button class="btn btn-primary" data-act="walk">I've tried it: show the walkthrough</button>
            <button class="btn btn-ghost" data-act="peek" aria-expanded="${state.peek}">Check my final answer</button>
            <button class="btn btn-quiet" data-act="got">Got it</button>
          </div>
          ${state.peek ? `<div class="answer-peek"><small>Final answer</small>${tex(p.final, false)}</div>` : ''}
        </section>
        ${question}</div>`;
    } else {
      const legend = Object.entries(p.legend).map(([k, t]) =>
        `<button class="key" data-slot="${k}"><span class="hl hl-${k}">${['', 'f′', 'x', 'y', '✓'][k]}</span>${esc(t)}</button>`).join('');
      body = `<div class="grid walk">
        <div>
          <section class="card solution" aria-label="Walkthrough">
            <div class="legend">${legend}</div>
            <ol class="steps">${p.steps.map(stepHtml).join('')}</ol>
            <div class="final"><small>Answer</small>${tex(p.final, false)}</div>
          </section>
          <section class="verdict">
            <h2>Does every line make sense?</h2>
            <p>Compare it with your copybook. If any step lost you, try the next problem: it changes one thing.</p>
            <div class="actions">
              <button class="btn btn-primary" data-act="got">Got it</button>
              <button class="btn btn-ghost" data-act="notyet">${state.i < 2 ? 'Not yet: try another' : 'Not yet'}</button>
            </div>
          </section>
          <details style="margin-top:18px"><summary style="cursor:pointer;font-weight:700">Show the question again</summary><div style="margin-top:12px">${question}</div></details>
        </div>
        <aside class="side"><section class="card graph-card" aria-label="Interactive graph">
          <div class="card-head"><strong>Drag the point along the curve</strong><span>tangent = slope</span></div>
          <div id="board" class="board jxgbox"></div>
          <div class="readout" id="readout"></div>
        </section></aside>
      </div>`;
    }
  }

  app.innerHTML = `
    <header class="skill-head">
      <div class="kicker">Skill · Differentiation · ${s.level}</div>
      <h1>${esc(s.title)}</h1>
      <div class="io"><b>${esc(s.input)}</b> → ${esc(s.output)}</div>
      <div class="head-row">
        <ol class="pips" aria-label="Progress">${pips}</ol>
        ${state.i === 0 && !state.end ? `<button class="chip-btn" data-act="nec" aria-expanded="${state.showNec}" aria-controls="nec">Necessary Skills (${LESSON.necessary.length})</button>` : ''}
      </div>
      ${state.showNec && state.i === 0 && !state.end ? necessaryHtml() : ''}
    </header>
    ${p.diff && !state.end ? `<div class="diff"><span class="tag">What's different</span><p>${esc(p.diff)}</p></div>` : ''}
    ${body}`;

  if (state.phase === 'walk' && !state.end) drawGraph(p);
}

// ── graph: colours come from the same CSS slots as the working ────────────────
const slotEls = { 1: [], 2: [], 3: [], 4: [] };
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function drawGraph(p) {
  if (board) JXG.JSXGraph.freeBoard(board);
  for (const k in slotEls) slotEls[k] = [];
  const g = p.graph, C = { 1: css('--hl1'), 2: css('--hl2'), 3: css('--hl3'), 4: css('--hl4') };
  board = JXG.JSXGraph.initBoard('board', { boundingbox: g.box, axis: true, showCopyright: false, showNavigation: false,
    pan: { enabled: false }, zoom: { enabled: false }, defaultAxes: { x: { ticks: { strokeColor: '#cfc7bd' } }, y: { ticks: { strokeColor: '#cfc7bd' } } } });
  const curve = board.create('functiongraph', [g.f], { strokeColor: '#1A1916', strokeWidth: 2.5, highlight: false });
  for (const pt of g.points) {
    slotEls[2].push(board.create('segment', [[pt.x, 0], [pt.x, pt.y]], { strokeColor: C[2], dash: 2, strokeWidth: 2, fixed: true, highlight: false }));
    slotEls[3].push(board.create('segment', [[0, pt.y], [pt.x, pt.y]], { strokeColor: C[3], dash: 1, strokeWidth: 2, fixed: true, highlight: false }));
    board.create('point', [pt.x, pt.y], { name: pt.name, fixed: true, size: 4, fillColor: '#1A1916', strokeColor: '#fff',
      label: { offset: [10, pt.name.startsWith('min') ? -16 : 14], fontSize: 13, cssStyle: 'font-family:Outfit;font-weight:700' }, highlight: false });
  }
  if (g.line) slotEls[4].push(board.create('line', g.line, { strokeColor: C[4], strokeWidth: 2.5, fixed: true, highlight: false }));
  const glider = board.create('glider', [g.start, g.f(g.start), curve], { name: '', size: 7, fillColor: C[1], strokeColor: '#fff', strokeWidth: 2, showInfobox: false });
  const tangent = board.create('tangent', [glider], { strokeColor: C[1], strokeWidth: 2.5, highlight: false });
  slotEls[1].push(tangent);
  const out = document.getElementById('readout'), span = g.box[2] - g.box[0];
  // fingers can't land on x = 1 exactly, so a drop near a turning point snaps onto it
  glider.on('up', () => {
    const near = g.points.find(pt => Math.abs(glider.X() - pt.x) < 0.05 * span);
    if (near) { glider.moveTo([near.x, near.y]); board.update(); }
  });
  const update = () => {
    const x = glider.X(), flat = g.points.some(pt => Math.abs(x - pt.x) < 1e-3 * span), m = flat ? 0 : g.df(x);
    out.innerHTML = `<div class="big">x = ${x.toFixed(2)} &nbsp; <span class="hl hl-1">slope = ${m.toFixed(2)}</span></div>
      <p>${flat ? '<span class="zero">Slope ≈ 0: the tangent is flat. This is a turning point.</span>'
        : m > 0 ? 'Slope positive: the curve is going up here.' : 'Slope negative: the curve is going down here.'}</p>`;
  };
  board.on('update', update); update();
}

function focusSlot(k) {
  if (k) app.dataset.focus = k; else delete app.dataset.focus;
  for (const [slot, els] of Object.entries(slotEls))
    for (const el of els) el.setAttribute({ strokeWidth: slot === String(k) ? 5 : 2.2, strokeOpacity: k && slot !== String(k) ? 0.25 : 1 });
}

app.addEventListener('mouseover', e => { const h = e.target.closest('.hl, .key'); if (!h) return;
  const k = h.dataset.slot || [...h.classList].find(c => /^hl-\d$/.test(c))?.slice(3); if (k) focusSlot(k); });
app.addEventListener('mouseout', e => { if (e.target.closest('.hl, .key')) focusSlot(null); });
app.addEventListener('focusin', e => { const key = e.target.closest('.key'); if (key) focusSlot(key.dataset.slot); });
app.addEventListener('focusout', e => { if (e.target.closest('.key')) focusSlot(null); });

app.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
  if (act === 'nec') state.showNec = !state.showNec;
  if (act === 'peek') state.peek = !state.peek;
  if (act === 'walk') state.phase = 'walk';
  if (act === 'got') state.end = 'got';
  if (act === 'notyet') { if (state.i < 2) Object.assign(state, { i: state.i + 1, phase: 'attempt', peek: false }); else state.end = 'stuck'; }
  if (act === 'restart') Object.assign(state, { i: 0, phase: 'attempt', peek: false, showNec: false, end: null });
  render();
  if (['walk', 'notyet', 'got', 'restart'].includes(act)) window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
</script>
</body>
</html>
